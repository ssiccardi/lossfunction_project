[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lossfunction-project"
version = "0.1.0"
description = "Custom training methodologies for heart-rate estimation from PPG signals, with ablation and negative-control evaluation."
requires-python = ">=3.9"
dependencies = [
    "numpy==1.24.4",
    "torch==2.5.1",
    "scipy==1.13.1",
    "matplotlib==3.9.3",
    "PyYAML==5.3.1",
]

[project.optional-dependencies]
dev = ["pytest==6.1.2"]

[tool.setuptools.packages.find]
where = ["src"]
