name: baseline_expanded_window_level
# Identical to baseline_expanded.yaml, except the train/val/test split is
# built by window_level_split below instead of the subject-level `assignment`
# (kept here for config-schema validity, but ignored once window_level_split
# is enabled). Secondary, leakage-illustration comparison only -- not a
# recommended evaluation protocol; see data/splits.apply_window_level_split.
assignment: expanded
subjects: [S1, S2, S3, S4, S5, S6, S7, S8]

model:
  type: cnn1d
  conv_channels: [16, 32, 64]
  kernel_size: 7
  dropout: 0.1

loss:
  type: mse

window_level_split:
  enabled: true
  seed: 42
  train_frac: 0.70
  val_frac: 0.15

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
