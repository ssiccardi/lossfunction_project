name: augmentation_only
assignment: default
subjects: [S1, S2, S3, S4, S5]

model:
  type: cnn1d
  conv_channels: [16, 32, 64]
  kernel_size: 7
  dropout: 0.1

loss:
  type: mse

# Augmented view x' built from each training window (not used for val/test).
# Defaults applied in the per-window-normalized (std=1) space -- see
# data/augmentations.py and PLAN-stage default choices.
augmentation:
  enabled: true
  noise_std: 0.03
  amplitude_scale_range: [0.9, 1.1]
  offset_range: [-0.1, 0.1]
  dropout_fraction: 0.07

# Ablation: augmented view used as ordinary extra training data (a second
# supervised loss term on x'), with NO consistency term -- isolates "more/
# varied training data" from "consistency regularization" (config C).
paired_training:
  extra_data_loss: true
  consistency_lambda: 0.0
  pairing_strategy: "true"

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
